<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>اینبار | بارکد من</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #1a2332;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 16px 16px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f4f8;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            color: #1a2332;
        }

        .header-left .back-btn:hover {
            background: #e8e4f8;
        }

        .header-left h1 {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Vazir', sans-serif;
        }

        .header-left h1 span {
            color: #6c5ce7;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f4f8;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .header-actions .icon-btn:hover {
            background: #e8e4f8;
        }

        /* ===== QR CARD ===== */
        .qr-card {
            background: #fff;
            border-radius: 24px;
            padding: 32px 24px 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f0f0;
            margin: 16px 0 20px;
            text-align: center;
        }

        .qr-card .cafe-info {
            margin-bottom: 20px;
        }

        .qr-card .cafe-info .cafe-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 4px;
        }

        .qr-card .cafe-info .cafe-name {
            font-size: 20px;
            font-weight: 700;
            font-family: 'Vazir', sans-serif;
        }

        .qr-card .cafe-info .cafe-address {
            font-size: 13px;
            color: #718096;
            font-family: 'Vazir', sans-serif;
        }

        /* ===== QR CODE ===== */
        .qr-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #fafbfc;
            border-radius: 20px;
            border: 2px dashed #e2e8f0;
            margin-bottom: 16px;
            position: relative;
        }

        .qr-wrapper .qr-code {
            width: 220px;
            height: 220px;
            background: #fff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .qr-wrapper .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qr-wrapper .qr-overlay {
            position: absolute;
            bottom: 8px;
            right: 12px;
            background: rgba(255, 255, 255, 0.9);
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 10px;
            color: #a0aec0;
            font-family: 'Vazir', sans-serif;
            border: 1px solid #e2e8f0;
        }

        /* ===== QR INFO ===== */
        .qr-info {
            background: #f7fafc;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 16px;
            text-align: right;
        }

        .qr-info .qr-label {
            font-size: 12px;
            color: #a0aec0;
            font-family: 'Vazir', sans-serif;
        }

        .qr-info .qr-url {
            font-size: 15px;
            font-weight: 600;
            color: #6c5ce7;
            font-family: 'Vazir', sans-serif;
            direction: ltr;
            text-align: left;
            margin-top: 2px;
            word-break: break-all;
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.25);
            font-family: 'Vazir', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(108, 92, 231, 0.35);
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: #6c5ce7;
            border: 2px solid #e2e8f0;
            padding: 13px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Vazir', sans-serif;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            border-color: #6c5ce7;
            background: #f8f7ff;
        }

        /* ===== SHARE OPTIONS ===== */
        .share-section {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .share-section .share-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Vazir', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .share-section .share-btn.whatsapp {
            background: #25D366;
            color: #fff;
        }

        .share-section .share-btn.whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }

        .share-section .share-btn.telegram {
            background: #0088cc;
            color: #fff;
        }

        .share-section .share-btn.telegram:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 136, 204, 0.3);
        }

        .share-section .share-btn.copy {
            background: #f0f4f8;
            color: #4a5568;
        }

        .share-section .share-btn.copy:hover {
            background: #e8e4f8;
            color: #6c5ce7;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 10px;
            z-index: 200;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            transition: all 0.3s;
            background: transparent;
            border: none;
            font-family: 'Vazir', sans-serif;
            position: relative;
        }

        .bottom-nav .nav-item .nav-icon {
            font-size: 22px;
            transition: transform 0.2s;
        }

        .bottom-nav .nav-item .nav-label {
            font-size: 10px;
            color: #a0aec0;
            font-weight: 500;
            transition: color 0.3s;
            font-family: 'Vazir', sans-serif;
        }

        .bottom-nav .nav-item.active .nav-label {
            color: #6c5ce7;
            font-weight: 700;
        }

        .bottom-nav .nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        .bottom-nav .nav-item.active {
            background: #f0f4f8;
        }

        .bottom-nav .nav-item .nav-badge {
            position: absolute;
            top: 0;
            right: 2px;
            background: #fc8181;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazir', sans-serif;
        }

        .bottom-nav .nav-item.scan-btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -14px;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
            padding: 0;
        }

        .bottom-nav .nav-item.scan-btn .nav-icon {
            font-size: 26px;
            color: #fff;
        }

        .bottom-nav .nav-item.scan-btn .nav-label {
            display: none;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2332;
            color: #fff;
            padding: 12px 24px;
            border-radius: 16px;
            font-family: 'Vazir', sans-serif;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .header {
                padding: 12px 12px 10px;
            }

            .header-left h1 {
                font-size: 16px;
            }

            .qr-card {
                padding: 24px 16px 20px;
            }

            .qr-wrapper .qr-code {
                width: 180px;
                height: 180px;
                padding: 8px;
            }

            .qr-card .cafe-info .cafe-icon {
                font-size: 40px;
            }

            .qr-card .cafe-info .cafe-name {
                font-size: 18px;
            }

            .share-section {
                flex-direction: column;
                gap: 8px;
            }

            .bottom-nav .nav-item {
                padding: 2px 8px;
            }

            .bottom-nav .nav-item .nav-icon {
                font-size: 20px;
            }

            .bottom-nav .nav-item .nav-label {
                font-size: 9px;
            }

            .bottom-nav .nav-item.scan-btn {
                width: 44px;
                height: 44px;
                margin-top: -10px;
            }

            .bottom-nav .nav-item.scan-btn .nav-icon {
                font-size: 22px;
            }
        }

        @media (max-width: 380px) {
            .qr-wrapper .qr-code {
                width: 150px;
                height: 150px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-top">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='hostHome.html'">→</button>
                <h1>📱 <span>بارکد</span> من</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="alert('راهنما')">❓</button>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="container">

        <!-- ===== QR CARD ===== -->
        <div class="qr-card">
            <div class="cafe-info">
                <span class="cafe-icon">☕</span>
                <div class="cafe-name">کافه میزبان</div>
                <div class="cafe-address">📍 تهران، خیابان ولیعصر، پلاک ۱۲۳</div>
            </div>

            <!-- ===== QR CODE ===== -->
            <div class="qr-wrapper">
                <div class="qr-code">
                    <img src="/src/assets/qr.png" alt="بارکد کافه میزبان" />
                </div>
                <span class="qr-overlay">🔍 اسکن کنید</span>
            </div>

            <!-- ===== QR INFO ===== -->
            <div class="qr-info">
                <div class="qr-label">🔗 لینک اسکن</div>
                <div class="qr-url" id="qrUrl">inbarapp.netlify.app/scan-result</div>
            </div>

            <!-- ===== BUTTONS ===== -->
            <button class="btn-primary" onclick="downloadQR()">
                ⬇️ دانلود بارکد
            </button>

            <!-- ===== SHARE ===== -->
            <div class="share-section">
                <button class="share-btn whatsapp" onclick="shareQR('whatsapp')">
                    💬 واتساپ
                </button>
                <button class="share-btn telegram" onclick="shareQR('telegram')">
                    ✈️ تلگرام
                </button>
                <button class="share-btn copy" onclick="copyQR()">
                    📋 کپی لینک
                </button>
            </div>
        </div>

    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="window.location.href='hostHome.html'">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">خانه</span>
        </button>
        <button class="nav-item" onclick="window.location.href='my-customer.html'">
            <span class="nav-icon">👥</span>
            <span class="nav-label">مشتریان</span>
        </button>
        <button class="nav-item scan-btn active" onclick="window.location.href='barcode.html'">
            <span class="nav-icon">📱</span>
            <span class="nav-label">بارکد</span>
        </button>
        <button class="nav-item" onclick="window.location.href='myplans.html'">
            <span class="nav-icon">📋</span>
            <span class="nav-label">پلن‌ها</span>
        </button>
        <button class="nav-item" onclick="window.location.href='my-profile.html'">
            <span class="nav-icon">👤</span>
            <span class="nav-label">پروفایل</span>
        </button>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ================================================================
        //  QR DATA
        // ================================================================
        const QR_URL = 'https://inbarapp.netlify.app/scan-result';
        const CAFE_NAME = 'کافه میزبان';

        // ================================================================
        //  DOWNLOAD QR
        // ================================================================
        function downloadQR() {
            const qrImg = document.querySelector('.qr-code img');

            if (!qrImg) {
                showToast('❌ بارکد یافت نشد');
                return;
            }

            // بارگذاری مجدد تصویر برای دانلود با کیفیت بالا
            const img = new Image();
            img.crossOrigin = 'anonymous';

            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // اندازه بزرگ برای دانلود با کیفیت
                canvas.width = 800;
                canvas.height = 950;

                // پس‌زمینه سفید
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // رسم QR (مرکز)
                const qrSize = Math.min(canvas.width, canvas.height) - 100;
                const offsetX = (canvas.width - qrSize) / 2;
                const offsetY = 40;
                ctx.drawImage(img, offsetX, offsetY, qrSize, qrSize);

                // اضافه کردن متن زیر QR
                ctx.fillStyle = '#1a2332';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';

                // نام کافه
                ctx.font = 'bold 32px Vazir, sans-serif';
                ctx.fillText(CAFE_NAME, canvas.width / 2, canvas.height - 50);

                // آدرس
                ctx.font = '18px Vazir, sans-serif';
                ctx.fillStyle = '#718096';
                ctx.fillText('inbarapp.netlify.app/scan-result', canvas.width / 2, canvas.height - 14);

                // دانلود
                const link = document.createElement('a');
                link.download = `barcode-${CAFE_NAME}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                showToast('✅ بارکد با موفقیت دانلود شد!');
            };

            img.onerror = function() {
                showToast('❌ خطا در دانلود بارکد');
            };

            // استفاده از src تصویر موجود
            img.src = qrImg.src;
        }

        // ================================================================
        //  SHARE QR
        // ================================================================
        function shareQR(platform) {
            const text = `☕ ${CAFE_NAME}\n🔗 اسکن کنید: ${QR_URL}`;

            let url = '';
            if (platform === 'whatsapp') {
                url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            } else if (platform === 'telegram') {
                url = `https://t.me/share/url?url=${encodeURIComponent(QR_URL)}&text=${encodeURIComponent(CAFE_NAME)}`;
            }

            if (url) {
                window.open(url, '_blank');
                showToast(`📤 در ${platform === 'whatsapp' ? 'واتساپ' : 'تلگرام'} باز شد`);
            }
        }

        // ================================================================
        //  COPY QR LINK
        // ================================================================
        function copyQR() {
            navigator.clipboard.writeText(QR_URL)
                .then(() => {
                    showToast('✅ لینک بارکد کپی شد!');
                })
                .catch(() => {
                    // fallback
                    const input = document.createElement('input');
                    input.value = QR_URL;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    showToast('✅ لینک بارکد کپی شد!');
                });
        }

        // ================================================================
        //  TOAST
        // ================================================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ================================================================
        //  INIT
        // ================================================================
        // نمایش آدرس در صفحه
        document.getElementById('qrUrl').textContent = QR_URL.replace('https://', '');

        console.log('✅ صفحه بارکد بارگذاری شد');
        console.log('🔗 آدرس QR:', QR_URL);
        console.log('🖼️ عکس QR:', '/src/assets/qr.png');
    </script>

</body>
</html>
