<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>اینبار | مشتریان من</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #1a2332;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 16px 16px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f4f8;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            color: #1a2332;
        }

        .header-left .back-btn:hover {
            background: #e8e4f8;
        }

        .header-left h1 {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Vazir', sans-serif;
        }

        .header-left h1 span {
            color: #6c5ce7;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f4f8;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .header-actions .icon-btn:hover {
            background: #e8e4f8;
        }

        /* ===== STATS ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 16px 0 20px;
        }

        .stat-box {
            background: #fff;
            border-radius: 14px;
            padding: 14px 12px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f0f0;
        }

        .stat-box .stat-number {
            font-size: 22px;
            font-weight: 800;
            color: #6c5ce7;
            font-family: 'Vazir', sans-serif;
        }

        .stat-box .stat-label {
            font-size: 12px;
            color: #718096;
            font-family: 'Vazir', sans-serif;
            margin-top: 2px;
        }

        /* ===== SEARCH ===== */
        .search-box {
            background: #fff;
            border-radius: 14px;
            padding: 10px 16px;
            border: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-box .search-icon {
            font-size: 18px;
            color: #a0aec0;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: 'Vazir', sans-serif;
            font-size: 14px;
            color: #1a2332;
            padding: 4px 0;
            text-align: right;
        }

        .search-box input::placeholder {
            color: #a0aec0;
        }

        .search-box input:focus {
            outline: none;
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: #fff;
            border-radius: 14px;
            padding: 4px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f0f0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tabs .tab {
            flex: 1;
            min-width: 70px;
            padding: 8px 12px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Vazir', sans-serif;
            background: transparent;
            color: #a0aec0;
            white-space: nowrap;
        }

        .tabs .tab.active {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.2);
        }

        .tabs .tab:hover:not(.active) {
            background: #f0f4f8;
            color: #4a5568;
        }

        .tabs .tab .tab-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 0 8px;
            border-radius: 50px;
            font-size: 10px;
            margin-right: 4px;
        }

        .tabs .tab.active .tab-badge {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== CUSTOMER LIST ===== */
        .customer-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .customer-card {
            background: #fff;
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f0f0;
            transition: all 0.3s;
            cursor: pointer;
        }

        .customer-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.06);
            border-color: #e2e8f0;
        }

        .customer-card .customer-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .customer-card .customer-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .customer-card .customer-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #edeafb, #e2dcf7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #6c5ce7;
            flex-shrink: 0;
            overflow: hidden;
        }

        .customer-card .customer-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .customer-card .customer-info .customer-name {
            font-size: 15px;
            font-weight: 700;
            font-family: 'Vazir', sans-serif;
        }

        .customer-card .customer-info .customer-detail {
            font-size: 12px;
            color: #718096;
            font-family: 'Vazir', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .customer-card .customer-info .customer-detail .rank-badge {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 600;
        }

        .customer-card .customer-info .customer-detail .rank-badge.bronze {
            background: #fef3c7;
            color: #d97706;
        }
        .customer-card .customer-info .customer-detail .rank-badge.silver {
            background: #f1f5f9;
            color: #64748b;
        }
        .customer-card .customer-info .customer-detail .rank-badge.gold {
            background: #fef3c7;
            color: #b45309;
        }
        .customer-card .customer-info .customer-detail .rank-badge.platinum {
            background: #e0e7ff;
            color: #4f46e5;
        }
        .customer-card .customer-info .customer-detail .rank-badge.diamond {
            background: #edeafb;
            color: #6c5ce7;
        }

        .customer-card .customer-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .customer-card .customer-actions .action-btn {
            padding: 4px 12px;
            border-radius: 50px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Vazir', sans-serif;
        }

        .customer-card .customer-actions .action-btn.prize {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
        }

        .customer-card .customer-actions .action-btn.prize:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
        }

        .customer-card .customer-actions .action-btn.message {
            background: #f0f4f8;
            color: #4a5568;
        }

        .customer-card .customer-actions .action-btn.message:hover {
            background: #e8e4f8;
            color: #6c5ce7;
        }

        .customer-card .customer-stats {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
        }

        .customer-card .customer-stats .cs-item {
            font-size: 12px;
            color: #718096;
            font-family: 'Vazir', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .customer-card .customer-stats .cs-item .cs-number {
            font-weight: 700;
            color: #1a2332;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border-radius: 20px;
            border: 2px dashed #e2e8f0;
        }

        .empty-state .empty-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state .empty-title {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Vazir', sans-serif;
        }

        .empty-state .empty-desc {
            font-size: 14px;
            color: #718096;
            font-family: 'Vazir', sans-serif;
            margin-top: 4px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: 28px;
            padding: 28px 24px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.9) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-box .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Vazir', sans-serif;
        }

        .modal-box .modal-header .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #f0f4f8;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            color: #4a5568;
        }

        .modal-box .modal-header .modal-close:hover {
            background: #fee2e2;
            color: #fc8181;
        }

        .modal-box .modal-body {
            text-align: center;
            padding: 8px 0;
        }

        .modal-box .modal-body .modal-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .modal-box .modal-body .modal-name {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Vazir', sans-serif;
        }

        .modal-box .modal-body .modal-detail {
            font-size: 14px;
            color: #718096;
            font-family: 'Vazir', sans-serif;
            margin-top: 4px;
        }

        .modal-box .modal-body .modal-rank {
            margin: 12px 0;
            padding: 10px;
            background: #f0f4f8;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Vazir', sans-serif;
        }

        .modal-box .modal-body .modal-rank .rank-emoji {
            font-size: 20px;
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .modal-box .modal-actions .btn-modal-primary {
            flex: 1;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Vazir', sans-serif;
            transition: all 0.3s;
        }

        .modal-box .modal-actions .btn-modal-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.3);
        }

        .modal-box .modal-actions .btn-modal-secondary {
            flex: 1;
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
            padding: 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Vazir', sans-serif;
            transition: all 0.3s;
        }

        .modal-box .modal-actions .btn-modal-secondary:hover {
            border-color: #fc8181;
            color: #fc8181;
            background: #fff5f5;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2332;
            color: #fff;
            padding: 12px 24px;
            border-radius: 16px;
            font-family: 'Vazir', sans-serif;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 10px;
            z-index: 200;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            transition: all 0.3s;
            background: transparent;
            border: none;
            font-family: 'Vazir', sans-serif;
            position: relative;
        }

        .bottom-nav .nav-item .nav-icon {
            font-size: 22px;
            transition: transform 0.2s;
        }

        .bottom-nav .nav-item .nav-label {
            font-size: 10px;
            color: #a0aec0;
            font-weight: 500;
            transition: color 0.3s;
            font-family: 'Vazir', sans-serif;
        }

        .bottom-nav .nav-item.active .nav-label {
            color: #6c5ce7;
            font-weight: 700;
        }

        .bottom-nav .nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        .bottom-nav .nav-item.active {
            background: #f0f4f8;
        }

        .bottom-nav .nav-item .nav-badge {
            position: absolute;
            top: 0;
            right: 2px;
            background: #fc8181;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazir', sans-serif;
        }

        .bottom-nav .nav-item.scan-btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -14px;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
            padding: 0;
        }

        .bottom-nav .nav-item.scan-btn .nav-icon {
            font-size: 26px;
            color: #fff;
        }

        .bottom-nav .nav-item.scan-btn .nav-label {
            display: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .header {
                padding: 12px 12px 10px;
            }

            .header-left h1 {
                font-size: 16px;
            }

            .stats-row {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .stat-box {
                padding: 10px 8px;
            }

            .stat-box .stat-number {
                font-size: 18px;
            }

            .tabs .tab {
                font-size: 12px;
                padding: 6px 10px;
                min-width: 60px;
            }

            .customer-card {
                padding: 12px 14px;
            }

            .customer-card .customer-avatar {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }

            .customer-card .customer-info .customer-name {
                font-size: 14px;
            }

            .customer-card .customer-actions .action-btn {
                font-size: 10px;
                padding: 3px 10px;
            }

            .modal-box {
                padding: 20px 16px 18px;
                border-radius: 20px;
            }

            .bottom-nav .nav-item {
                padding: 2px 8px;
            }

            .bottom-nav .nav-item .nav-icon {
                font-size: 20px;
            }

            .bottom-nav .nav-item .nav-label {
                font-size: 9px;
            }

            .bottom-nav .nav-item.scan-btn {
                width: 44px;
                height: 44px;
                margin-top: -10px;
            }

            .bottom-nav .nav-item.scan-btn .nav-icon {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-top">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='host-home.html'">→</button>
                <h1>👥 <span>مشتریان</span> من</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="alert('فیلتر')">⚙️</button>
                <button class="icon-btn" onclick="alert('مرتب‌سازی')">📊</button>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="container">

        <!-- ===== STATS ===== -->
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-number">۲۴۸</div>
                <div class="stat-label">مجموع مشتریان</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">۸۶</div>
                <div class="stat-label">جدید این ماه</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">۴.۸</div>
                <div class="stat-label">میانگین امتیاز</div>
            </div>
        </div>

        <!-- ===== SEARCH ===== -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="جستجوی مشتری..." oninput="filterCustomers()" />
        </div>

        <!-- ===== TABS ===== -->
        <div class="tabs">
            <button class="tab active" data-tab="all" onclick="switchTab('all')">
                📋 همه
                <span class="tab-badge">۱۲</span>
            </button>
            <button class="tab" data-tab="diamond" onclick="switchTab('diamond')">
                🌟 الماس
                <span class="tab-badge">۳</span>
            </button>
            <button class="tab" data-tab="gold" onclick="switchTab('gold')">
                🥇 طلا
                <span class="tab-badge">۴</span>
            </button>
            <button class="tab" data-tab="silver" onclick="switchTab('silver')">
                🥈 نقره
                <span class="tab-badge">۵</span>
            </button>
            <button class="tab" data-tab="bronze" onclick="switchTab('bronze')">
                🥉 برنز
                <span class="tab-badge">۶</span>
            </button>
        </div>

        <!-- ===== CUSTOMER LIST ===== -->
        <div class="customer-list" id="customerList">
            <!-- توسط JS پر میشه -->
        </div>

    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="prizeModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>🎁 ارسال جایزه</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <span class="modal-icon" id="modalCustomerIcon">👤</span>
                <div class="modal-name" id="modalCustomerName">معین حاج ابراهیمی</div>
                <div class="modal-detail">ارسال جایزه به این مشتری</div>
                <div class="modal-rank" id="modalCustomerRank">
                    <span class="rank-emoji">🌟</span> سطح: الماس
                </div>
                <div style="font-size:13px; color:#718096; font-family:'Vazir',sans-serif; margin-bottom:8px;">
                    لطفاً نوع جایزه را انتخاب کنید
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
                    <button class="action-btn prize" style="padding:8px 20px; border-radius:50px; border:none; background:linear-gradient(135deg,#f6ad55,#ed8936); color:#fff; font-weight:600; cursor:pointer; font-family:'Vazir',sans-serif; font-size:13px;" onclick="sendPrize('discount')">💰 تخفیف</button>
                    <button class="action-btn prize" style="padding:8px 20px; border-radius:50px; border:none; background:linear-gradient(135deg,#6c5ce7,#a29bfe); color:#fff; font-weight:600; cursor:pointer; font-family:'Vazir',sans-serif; font-size:13px;" onclick="sendPrize('rank')">🏆 افزایش رنک</button>

        // ================================================================
        //  STATE
        // ================================================================
        let currentTab = 'all';
        let selectedCustomer = null;
        let searchQuery = '';

        // ================================================================
        //  FILTER FUNCTIONS
        // ================================================================
        function getFilteredCustomers() {
            let filtered = customers;

            // فیلتر بر اساس تب
            if (currentTab !== 'all') {
                filtered = filtered.filter(c => c.rank === currentTab);
            }

            // فیلتر بر اساس جستجو
            if (searchQuery.trim()) {
                const query = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(c =>
                    c.name.includes(query) ||
                    c.phone.includes(query) ||
                    rankLabel[c.rank].includes(query)
                );
            }

            return filtered;
        }

        // ================================================================
        //  SWITCH TAB
        // ================================================================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tabs .tab').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });
            renderCustomers();
        }

        // ================================================================
        //  SEARCH
        // ================================================================
        function filterCustomers() {
            const input = document.getElementById('searchInput');
            searchQuery = input.value;
            renderCustomers();
        }

        // ================================================================
        //  RENDER CUSTOMERS
        // ================================================================
        function renderCustomers() {
            const container = document.getElementById('customerList');
            const filtered = getFilteredCustomers();

            // آپدیت شمارنده‌های تب
            document.querySelectorAll('.tabs .tab').forEach(el => {
                const tab = el.dataset.tab;
                const count = tab === 'all' ? customers.length :
                    customers.filter(c => c.rank === tab).length;
                const badge = el.querySelector('.tab-badge');
                if (badge) badge.textContent = count;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                            <div class="empty-state">
                                <span class="empty-icon">🔍</span>
                                <div class="empty-title">نتیجه‌ای یافت نشد</div>
                                <div class="empty-desc">مشتری‌ای با این مشخصات وجود ندارد</div>
                            </div>
                        `;
                return;
            }

            container.innerHTML = filtered.map(customer => `
                        <div class="customer-card">
                            <div class="customer-top">
                                <div class="customer-left">
                                    <div class="customer-avatar">${customer.avatar}</div>
                                    <div class="customer-info">
                                        <div class="customer-name">${customer.name}</div>
                                        <div class="customer-detail">
                                            ${rankEmoji[customer.rank]}
                                            <span class="rank-badge ${rankClass[customer.rank]}">${rankLabel[customer.rank]}</span>
                                            <span>· ${customer.visits} بازدید</span>
                                            <span>· ${customer.points} امتیاز</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="customer-actions">
                                    <button class="action-btn prize" onclick="event.stopPropagation(); openPrizeModal(${customer.id})">
                                        🎁 ارسال جایزه
                                    </button>
                                    <button class="action-btn message" onclick="event.stopPropagation(); showToast('پیام به ${customer.name} ارسال شد')">
                                        💬 پیام
                                    </button>
                                </div>
                            </div>
                            <div class="customer-stats">
                                <span class="cs-item">📅 عضو از: <span class="cs-number">${customer.joined}</span></span>
                                <span class="cs-item">📞 <span class="cs-number">${customer.phone}</span></span>
                            </div>
                        </div>
                    `).join('');
        }

        // ================================================================
        //  MODAL
        // ================================================================
        function openPrizeModal(customerId) {
            const customer = customers.find(c => c.id === customerId);
            if (!customer) return;

            selectedCustomer = customer;
            document.getElementById('modalCustomerIcon').textContent = customer.avatar;
            document.getElementById('modalCustomerName').textContent = customer.name;
            document.getElementById('modalCustomerRank').innerHTML = `
                        ${rankEmoji[customer.rank]} سطح: ${rankLabel[customer.rank]}
                    `;

            document.getElementById('prizeModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('prizeModal').classList.remove('show');
            selectedCustomer = null;
        }

        // ================================================================
        //  SEND PRIZE
        // ================================================================
        function sendPrize(type) {
            if (!selectedCustomer) return;

            const prizeTypes = {
                discount: '💰 تخفیف ۲۰٪',
                rank: '🏆 افزایش ۲ رنک',
                custom: '🎁 هدیه ویژه'
            };

            closeModal();
            showToast(`✅ جایزه "${prizeTypes[type]}" برای ${selectedCustomer.name} ارسال شد!`);

            console.log('🎁 جایزه ارسال شد:', {
                customer: selectedCustomer.name,
                prize: prizeTypes[type],
                timestamp: new Date().toISOString()
            });
        }

        // ================================================================
        //  TOAST
        // ================================================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ================================================================
        //  KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ================================================================
        //  INIT
        // ================================================================
        renderCustomers();
        console.log('✅ صفحه مشتریان من بارگذاری شد');
        console.log('👥 تعداد کل مشتریان:', customers.length);
